server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration (Defaults to embedded H2 for instant cloud deploy, override with DB_URL for MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:mams_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hikari Connection Pool Settings
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JWT Properties (Externalized Secret)
mams.jwt.secret=${JWT_SECRET:c3VwZXItc2VjdXJlLW1pbGl0YXJ5LWFzc2V0LW1hbmFnZW1lbnQtc3lzdGVtLWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLXNwcmluZy1ib290}
mams.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.military.mams=INFO
