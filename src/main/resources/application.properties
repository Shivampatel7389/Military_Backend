server.port=${PORT:8080}

# Database Configuration (Externalized Environment Variable - No Plaintext Password)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mams_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Properties (Externalized Secret)
mams.jwt.secret=${JWT_SECRET:c3VwZXItc2VjdXJlLW1pbGl0YXJ5LWFzc2V0LW1hbmFnZW1lbnQtc3lzdGVtLWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLXNwcmluZy1ib290}
mams.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.military.mams=INFO
